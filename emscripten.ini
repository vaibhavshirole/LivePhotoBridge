[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
cpp_std = 'c++20'
c_args = ['-sWASM=1']
cpp_args = ['-sWASM=1']
cpp_link_args = ['-sWASM=1', '-sALLOW_MEMORY_GROWTH=1', '-lembind']
